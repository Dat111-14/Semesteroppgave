<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finn din boligtype</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div id="navbar"></div>

    <main class="boligtype-page">
      <section class="quiz">
        <h1>Hvilken bolig passer deg?</h1>

        <p id="question"></p>

        <div id="answers"></div>
      </section>

      <section id="result" class="result">
        <h2>Din boligtype er:</h2>

        <h3 id="resultTitle"></h3>

        <p id="resultText"></p>

        <button onclick="restartQuiz()">Ta quizen på nytt</button>
      </section>
    </main>

    <footer class="footer">
      <p>Bolig i Bergen AS</p>
      <p>Org.nr: 123 456 789</p>
      <p>Adresse: Torgallmenningen 1, 5014 Bergen</p>
      <p>Telefon: +47 55 55 55 55</p>
      <p>E-post: info@boligibergen.no</p>
    </footer>

    <script>

        const $ = id => document.getElementById(id);
        const quiz = document.querySelector(".quiz");

        fetch("nav.html").then(r => r.text()).then(html => $("navbar").innerHTML = html);

        // Spørsmål, deretter svar i fast rekkefølge: leilighet, rekkehus, enebolig
        const questions = [
            {
                question: "Hvor viktig er det å bo sentralt?",
                answers: [
                    ["Veldig viktig", "apartment"],
                    ["Ganske viktig", "townhouse"],
                    ["Ikke så viktig", "house"]
                ]
            },
            {
                question: "Hvor mye plass trenger du?",
                answers: [
                    ["Lite", "apartment"],
                    ["Middels", "townhouse"],
                    ["Mye", "house"]
                ]
            },
            {
                question: "Hvor viktig er egen uteplass?",
                answers: [
                    ["Ikke viktig", "apartment"],
                    ["Ganske viktig", "townhouse"],
                    ["Veldig viktig", "house"]
                ]
            },
            {
                question: "Hvor mye vedlikehold ønsker du?",
                answers: [
                    ["Så lite som mulig", "apartment"],
                    ["Litt", "townhouse"],
                    ["Det gjør ikke noe", "house"]
                ]
            },
            {
                question: "Hvor viktig er privatliv?",
                answers: [
                    ["Ikke så viktig", "apartment"],
                    ["Ganske viktig", "townhouse"],
                    ["Veldig viktig", "house"]
                ]
            }
        ];

        let currentQuestion = 0;

        let scores = {
            apartment: 0,
            townhouse: 0,
            house: 0
        };

        function showQuestion() {
            if (current == questions.length) return showResult();
            const [question, ...answers] = questions[current];
            $("question").textContent = question;
            $("answers").replaceChildren(...answers.map((textContent, i) =>
                Object.assign(document.createElement("button"), {
                    textContent,
                    onclick: () => { scores[i]++; current++; showQuestion(); }
                })
            ));
        }

        function showResult() {
            // indexOf gir første treff, så uavgjort går til leilighet, deretter rekkehus
            [$("resultTitle").textContent, $("resultText").textContent] = results[scores.indexOf(Math.max(...scores))];
            quiz.style.display = "none";
            $("result").style.display = "block";
        }

        function restartQuiz() {
            current = 0;
            scores = [0, 0, 0];
            quiz.style.display = $("result").style.display = "";
            showQuestion();
        }

        restartQuiz();

    </script>
  </body>
</html>
