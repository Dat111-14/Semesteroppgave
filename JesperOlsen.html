<!DOCTYPE html>
<html>
<head>
<style>
body {
  background-color: #eef2f7;
  font-family: Arial, sans-serif;
}

h1 {
   color: black;
}

.info-tekst {
  margin-top: 0;
  margin-bottom: 24px;
  font-size: 16px;
  line-height: 1.5;
  color: #333;
  max-width: 800px;
}

.navn-container {
  display: grid;
  grid-template-columns: 1fr 1fr; 
  gap: 16px 20px;
  max-width: 800px;
}

.navn-lenke {
  text-decoration: none;
  display: block;
}

.navn-brikke {
  background-color: #ffffff;
  color: #333;
  padding: 16px 20px;
  border-left: 5px solid #4CAF50;
  border-radius: 4px;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer; 
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.navn-brikke:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
  background-color: #fcfdfc;
}
</style>
</head>
<body>

<h1><div class="navn-brikke">Jesper Olsen - Prosjektmedlem</h1>

</body>
</html>
